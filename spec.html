<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Loreforge — contrato da fronteira</title>
  <!--
    Ferramenta de MANTENEDOR, não tela de jogo. Fica fora do index.html de
    propósito e não é linkada de lugar nenhum do HUD: um menu de capacidades
    chamáveis renderizado a quem JOGA é violação do Princípio V. Quem abre isto
    está auditando o contrato, não jogando.

    Sem Swagger UI de verdade (bundle de ~1,5 MB por CDN): o client roda offline e
    o Princípio I proíbe dependência de rede. São ~200 linhas de CSS/JS que leem
    /api/spec — o mesmo documento que qualquer ferramenta OpenAPI consumiria.
  -->
  <style>
    :root {
      --bg:#0f0d0a; --panel:#17140f; --panel-2:#1e1a13; --panel-3:#252017;
      --ink:#e8ddc7; --ink-dim:#a2977f;
      --accent:#cd9a42; --accent-bright:#e8b95c; --accent-dim:#7a6033;
      --line:#332b1f; --warn:#c98a3c;
      --c-escolha:#6f9bd1; --c-voz:#9b7fc4; --c-juizo:#c9634f; --c-sistema:#8a8071;
      color-scheme: dark;
    }
    * { box-sizing:border-box; }
    body {
      margin:0; background:var(--bg); color:var(--ink);
      font:15px/1.6 Georgia,"Times New Roman",serif; padding:2rem 1rem;
    }
    .wrap { max-width:900px; margin:0 auto; }
    h1 {
      font-variant:small-caps; letter-spacing:.06em; color:var(--accent-bright);
      font-size:1.9rem; margin:0 0 .1rem;
      text-shadow:0 1px 0 rgba(0,0,0,.7), 0 0 14px rgba(205,154,66,.35);
    }
    .sub { color:var(--ink-dim); font-style:italic; margin:0 0 1.4rem; font-size:.92rem; }
    .panel {
      position:relative; background:var(--panel); border:1px solid var(--line);
      padding:1rem 1.1rem; margin:0 0 1.1rem;
    }
    .panel::before, .panel::after {
      content:""; position:absolute; width:9px; height:9px; border:1px solid var(--accent-dim);
    }
    .panel::before { top:-1px; left:-1px; border-right:0; border-bottom:0; }
    .panel::after { bottom:-1px; right:-1px; border-left:0; border-top:0; }
    h2 {
      font-size:1.05rem; text-transform:uppercase; letter-spacing:.12em;
      color:var(--accent); border-bottom:1px solid var(--line);
      padding-bottom:.3rem; margin:0 0 .8rem;
    }
    .legenda { display:flex; flex-wrap:wrap; gap:.5rem 1.1rem; font-size:.85rem; margin:.4rem 0 0; }
    .chip {
      display:inline-block; padding:.05rem .5rem; border-radius:2px;
      font:600 .74rem/1.6 system-ui,sans-serif; text-transform:uppercase;
      letter-spacing:.06em; color:#141109;
    }
    .chip.escolha{background:var(--c-escolha)} .chip.voz{background:var(--c-voz)}
    .chip.juizo{background:var(--c-juizo)} .chip.sistema{background:var(--c-sistema)}
    .rota { border-left:3px solid var(--accent-dim); padding:.45rem .8rem; margin:0 0 .45rem; background:var(--panel-2); }
    .verbo { font:700 .72rem/1.6 system-ui,sans-serif; letter-spacing:.08em; color:var(--accent-bright); }
    .url { font-family:ui-monospace,Menlo,monospace; font-size:.86rem; color:var(--ink); }
    .rota .d { color:var(--ink-dim); font-size:.88rem; font-style:italic; margin:.15rem 0 0; }
    details.cap { border-left:3px solid var(--c-escolha); background:var(--panel-2); margin:0 0 .4rem; padding:.4rem .8rem; }
    details.cap[data-interna="1"] { border-left-color:var(--c-sistema); opacity:.75; }
    details.cap summary { cursor:pointer; list-style:none; }
    details.cap summary::-webkit-details-marker { display:none; }
    .nome { font-family:ui-monospace,Menlo,monospace; color:var(--accent-bright); font-size:.95rem; }
    .tag { font:600 .68rem/1.6 system-ui,sans-serif; color:var(--ink-dim); letter-spacing:.06em; margin-left:.5rem; }
    .desc { color:var(--ink-dim); font-size:.9rem; font-style:italic; margin:.35rem 0 .5rem; }
    table { width:100%; border-collapse:collapse; font-size:.86rem; }
    th { text-align:left; color:var(--accent-dim); font:600 .7rem/1.8 system-ui,sans-serif;
         text-transform:uppercase; letter-spacing:.08em; border-bottom:1px solid var(--line); }
    td { padding:.28rem .5rem .28rem 0; border-bottom:1px solid #221d15; vertical-align:top; }
    td.p { font-family:ui-monospace,Menlo,monospace; color:var(--ink); }
    .obrig { color:var(--warn); font-size:.75rem; }
    .aviso { border-left:3px solid var(--c-juizo); background:#1d1310; padding:.7rem .9rem; font-size:.9rem; }
    .erro { color:var(--c-juizo); }
    code { font-family:ui-monospace,Menlo,monospace; font-size:.88em; color:var(--accent-bright); }
    a { color:var(--accent-bright); }
    .barra { display:flex; flex-wrap:wrap; align-items:baseline; gap:.6rem; margin:0 0 .8rem; }
    .barra label { color:var(--accent-dim); font:600 .7rem/1.8 system-ui,sans-serif;
                   text-transform:uppercase; letter-spacing:.08em; }
    select {
      background:var(--panel-3); color:var(--ink); border:1px solid var(--line);
      padding:.25rem .45rem; font:inherit; font-size:.88rem; max-width:100%;
    }
    select:focus { outline:1px solid var(--accent-dim); }
    .conta { color:var(--ink-dim); font-size:.85rem; font-style:italic; }
    [hidden] { display:none !important; }
  </style>
</head>
<body>
<div class="wrap">
  <h1>Loreforge</h1>
  <p class="sub">O contrato da fronteira — gerado do código, não escrito à mão.</p>
  <div id="conteudo"><p class="sub">carregando <code>/api/spec</code>…</p></div>
</div>

<script>
const esc = (s) => String(s == null ? "" : s)
  .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");

function tabelaParams(schema) {
  const props = schema.properties || {};
  const nomes = Object.keys(props);
  if (!nomes.length) return `<p class="desc">Sem parâmetros.</p>`;
  const obrig = new Set(schema.required || []);
  const linhas = nomes.map((p) => {
    const s = props[p], cls = s["x-classe"] || "escolha";
    const tipo = s.type || (s.enum ? "enum" : "—");
    const fonte = s["x-fonte-de-enum"] ? ` <span class="tag">enum: ${esc(s["x-fonte-de-enum"])}</span>` : "";
    return `<tr>
      <td class="p">${esc(p)}${obrig.has(p) ? ' <span class="obrig">obrigatório</span>' : ""}</td>
      <td>${esc(tipo)}${fonte}</td>
      <td><span class="chip ${cls}">${cls}</span></td></tr>`;
  }).join("");
  return `<table><thead><tr><th>parâmetro</th><th>tipo</th><th>classe</th></tr></thead>
          <tbody>${linhas}</tbody></table>`;
}

function render(spec) {
  const cap = spec["x-capacidades"] || {};
  const caps = (spec.components && spec.components.schemas) || {};
  const paths = spec.paths || {};

  const rotas = Object.keys(paths).sort().map((url) => {
    const ops = paths[url];
    return Object.keys(ops).map((verbo) => {
      const o = ops[verbo];
      const params = (o.parameters || []).map((q) =>
        `${q.name}${q.required ? "" : "?"}`).join(", ");
      return `<div class="rota">
        <span class="verbo">${verbo.toUpperCase()}</span>
        <span class="url">${esc(url)}${params ? "?" + esc(params) : ""}</span>
        <div class="d">${esc(o.summary || "")}${o.description ? " — " + esc(o.description) : ""}</div>
      </div>`;
    }).join("");
  }).join("");

  const lista = Object.keys(caps).sort().map((n) => {
    const c = caps[n];
    const interna = c["x-expoe-a-mente"] === false;
    const inativa = c["x-ativa-neste-mundo"] === false;
    const consulta = c["x-consulta"] === true;
    const marcas = [interna ? '<span class="tag">interna — não desce</span>' : "",
                    inativa ? '<span class="tag">desativada neste mundo</span>' : "",
                    consulta ? '<span class="tag">consulta — só lê, não muta</span>' : ""].join("");
    // `data-nome` é o que o filtro por personagem casa contra a face — o nome é a
    // chave em toda a fronteira (registro, face, MCP), então filtrar por ele não
    // introduz um segundo identificador.
    return `<details class="cap" data-nome="${esc(n)}" data-interna="${interna ? 1 : 0}">
      <summary><span class="nome">${esc(n)}</span>${marcas}</summary>
      <p class="desc">${esc(c.description || "")}</p>
      ${tabelaParams(c)}
    </details>`;
  }).join("");

  const juizo = (cap.params_de_juizo || []).map((p) => `<code>${esc(p)}</code>`).join(", ");

  document.getElementById("conteudo").innerHTML = `
    <div class="panel">
      <h2>Como ler</h2>
      <p class="desc" style="font-style:normal">${esc(spec.info.version)} · ${cap.total || 0}
        capacidades, ${cap.expostas || 0} expostas à Mente.</p>
      <div class="legenda">
        <span><span class="chip escolha">escolha</span> quem, o quê, para onde — desce</span>
        <span><span class="chip voz">voz</span> a fala do personagem — desce</span>
        <span><span class="chip juizo">juizo</span> a nota da régua — <b>nunca desce</b></span>
        <span><span class="chip sistema">sistema</span> a caneta do mundo — <b>nunca desce</b></span>
      </div>
      <p class="desc" style="margin-top:.7rem">Esta é a visão do <b>mantenedor</b>: mostra
        inclusive o que a fronteira retém. A face que a Mente recebe é esta menos
        <span class="chip juizo">juizo</span> e menos as capacidades internas.</p>
    </div>

    <div class="panel">
      <h2>Auditoria da fronteira</h2>
      <div class="aviso">
        <b>${(cap.params_de_juizo || []).length} parâmetros de juízo</b> — estes não podem
        aparecer em nada que desça ao client:<br>${juizo || "—"}
        <br><br><b>${(cap.internas || []).length} capacidades internas</b>:
        ${(cap.internas || []).map((n) => `<code>${esc(n)}</code>`).join(", ") || "—"}
      </div>
    </div>

    <div class="panel"><h2>Rotas</h2>${rotas}</div>

    <div class="panel">
      <h2>Capacidades</h2>
      <div class="barra">
        <label for="filtro">quem enxerga</label>
        <select id="filtro"><option value="">todas — a visão do mantenedor</option></select>
        <span class="conta" id="conta"></span>
      </div>
      <div id="lista">${lista}</div>
    </div>`;

  montarFiltro();
}

// --- O FILTRO POR PERSONAGEM ------------------------------------------------ //
// Por que ele existe: esta página lista o CONTRATO INTEIRO, e o contrato inteiro
// nunca é o que um personagem enxerga. A face é filtrada pela CENA (quem está
// presente, o que ele carrega, se está dormindo), então "que capacidades existem"
// e "que capacidades a Mente da Hulda recebe agora" são perguntas diferentes — e
// só a segunda explica por que ela propôs o que propôs.
//
// A fonte é `/api/context`, que já devolve `capacidades` no MESMO payload do
// contexto (spec 043, FR-007). Não há endpoint novo e não há segunda montagem da
// face: se houvesse, a bancada poderia discordar do que o mundo de fato oferece,
// que é justamente o erro que ela deveria pegar.

async function montarFiltro() {
  const sel = document.getElementById("filtro");
  const conta = document.getElementById("conta");
  if (!sel) return;

  try {
    const r = await fetch(base + "/api/characters");
    if (!r.ok) throw new Error("HTTP " + r.status);
    for (const p of await r.json()) {
      const o = document.createElement("option");
      o.value = p.id;
      // o rótulo da opção leva o lugar para desambiguar homônimos na lista; o NOME
      // puro fica de lado porque a linha de contagem já diz o lugar, e dela vem do
      // contexto VIVO (que pode divergir desta lista — alguém em trânsito, por ex.).
      o.dataset.nome = p.name || p.id;
      o.textContent = o.dataset.nome + (p.location ? ` — ${p.location}` : "");
      sel.appendChild(o);
    }
  } catch (e) {
    // sem a lista, a página segue servindo para o que ela sempre serviu.
    conta.textContent = "(não foi possível listar personagens: " + e.message + ")";
  }

  const fichas = [...document.querySelectorAll("#lista details.cap")];

  sel.onchange = async () => {
    const quem = sel.value;
    if (!quem) {
      for (const f of fichas) f.hidden = false;
      conta.textContent = `${fichas.length} capacidades — o contrato inteiro, inclusive o que a fronteira retém.`;
      return;
    }
    conta.textContent = "lendo a cena…";
    try {
      const r = await fetch(base + "/api/context?character_id=" + encodeURIComponent(quem));
      if (!r.ok) throw new Error("HTTP " + r.status);
      const ctx = await r.json();
      const naFace = new Set((ctx.capacidades || []).map((c) => c.nome));
      for (const f of fichas) f.hidden = !naFace.has(f.dataset.nome);
      const nome = sel.options[sel.selectedIndex].dataset.nome || quem;
      const lugar = (ctx.location && ctx.location.name) || "algum lugar";
      conta.textContent =
        `${naFace.size} de ${fichas.length} descem para ${nome}, em ${lugar}` +
        ` — as outras ${fichas.length - naFace.size} a fronteira retém agora` +
        ` (internas, desativadas, ou sem alvo nesta cena).`;
    } catch (e) {
      for (const f of fichas) f.hidden = false;
      conta.textContent = "não foi possível ler a cena: " + e.message;
    }
  };
}

const base = (localStorage.getItem("loreforge.serverBase") || "").replace(/\/$/, "");
fetch(base + "/api/spec")
  .then((r) => { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
  .then(render)
  .catch((e) => {
    document.getElementById("conteudo").innerHTML =
      `<div class="panel"><p class="erro">Não foi possível ler <code>/api/spec</code>: ${esc(e.message)}</p></div>`;
  });
</script>
</body>
</html>
